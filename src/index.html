<!DOCTYPE html>
<html>

<head>
  <title>BSL-editor</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta http-equiv="Content-Type" content="text/html;charset=utf-8">  
  <link href="./decorations.css" rel="stylesheet">
  <link href="./tree/tree.css" rel="stylesheet">
  <link href="./tingle.css" rel="stylesheet">
  <script src="./tingle.js"></script>
  <style>
    html,
    body {
      height: 100%;
      margin: 0px;
    }
    #container {
      height: 100%;
    }
  </style>
</head>

<body>

  <div id="container"></div>
  <div id="display">
    <div id="display-header">
      <div id="display-title"></div>
      <div id="display-close"></div>
    </div>
    <div id="variables-display">
      <div id="variables-tree"></div>
    </div>    
  </div>
  <button id="event-button"></button>
  <script>
    console.log("INDEX.HTML VERSION = 2025-DEBUG-API");
  </script>
  <script>
    function getCode() {
      return '';
    }
  </script>
  <script src="./vs/loader.js"></script>
  <script src="./parsers.js"></script>
  <script src="./finder.js"></script>
  <script src="./bsl_helper.js"></script>
  <script src="./init.js"></script>
  <script src="./tree/tree.js"></script>
  <script>
    window.addEventListener("message", (e) => {
      console.log(
        "[IFRAME] message received",
        e.data,
        "from",
        e.origin
      );

      //if (e.origin !== "https://github.com/workmikhail") return;

      const data = e.data;
      if (!data || data.type !== "call") return;

      const { method, args } = data;
      console.log(
        "[IFRAME] call request",
        method,
        args
      );
      if (!window.AppApi || typeof window.AppApi[method] !== "function") {
        console.error("Method not found:", method);
        return;
      }

      let result;
      try {
        result = window.AppApi[method](...(args || []));
      } catch (err) {
        console.error("Error executing method:", method, err);
        result = null;
      }
      e.source.postMessage({
        type: "result",
        value: result
      }, "*");
    });
  </script>
</body>

</html>
